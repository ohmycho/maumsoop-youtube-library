  마음숲 영상 라이브러리
  버전: v1.5 (2026-10-20)
  v1.5 정렬 버튼(최신순 기본·조회수순), 카드에 올린 날짜·조회수 표시, 내장 저장본 418개(날짜·조회수 포함)로 교체
  v1.4.1 영상 탭 게시 주소 연결 (이제 시트를 읽어 옴)
  v1.4  시트 '구분' 열(공개/미리보기/회원전용): 회원 전용은 🔒 표시 + 가입 안내 창, 목록 10개마다 1개 간격 배치, 미리보기 표시
  v1.3  영상 목록을 구글시트 '영상' 탭에서 읽기 (실패 시 내장 목록), 최근 14일 영상 NEW 표시, 텍스트 안전 처리
  v1.2  화면 확대 허용 (viewport 잠금 해제, 입력칸 16px로 iOS 자동확대 방지)
  v1.1  속도 개선 (카드 20개씩 표시, Tailwind CDN 제거, 썸네일 mqdefault, 오류 폰트 링크 제거)
  v1.0  최초 배포본
-->

  <!-- 상단 헤더 & 검색/필터 영역 -->
  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-6 sm:py-8">
      
      <!-- 1. 중앙 타이틀 & 대형 글로벌 검색창 -->

      const panel = document.getElementById("filterPanel");
      const btn = document.getElementById("mobileFilterBtn");
      const icon = document.getElementById("mobileFilterIcon");
      const isHidden = panel.classList.contains("hidden");

      panel.classList.toggle("hidden", !isHidden);
      btn.setAttribute("aria-expanded", String(isHidden));
      icon.innerText = isHidden ? "접기 ▴" : "펼치기 ▾";
    }

    function toggleKeywordPanel() {
      const panel = document.getElementById("keywordPanel");
      const open = panel.classList.contains("hidden");
      panel.classList.toggle("hidden", !open);
      document.getElementById("keywordToggleBtn").setAttribute("aria-expanded", String(open));
      document.getElementById("keywordToggleIcon").innerText = open ? "▴" : "▾";
    }

    function renderKeywords() {
      const container = document.getElementById("keywordContainer");
      container.innerHTML = coreKeywords.map(kw => `
        <button onclick="toggleKeyword('${kw}')" data-kw="${kw}" aria-pressed="false"
          class="kw-btn min-h-[36px] px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">
          ${kw}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      currentCategory = cat;
      currentKeyword = "";
      document.querySelectorAll(".kw-btn").forEach(btn => {
        btn.classList.remove("kw-active");
        btn.setAttribute("aria-pressed", "false");
      });

      // 버튼 클릭 시 텍스트 검색 초기화
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      document.querySelectorAll(".cat-btn").forEach(btn => {
        const isActive = btn.innerText.includes(cat) || (cat === '전체' && btn.innerText === '전체보기');
        btn.classList.toggle("tag-active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
      updateActiveFilterBar();
      renderCards();
    }

    function toggleKeyword(kw) {
      currentKeyword = (currentKeyword === kw) ? "" : kw;

      // 버튼 클릭 시 텍스트 검색 초기화
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      document.querySelectorAll(".kw-btn").forEach(btn => {
        const isActive = (btn.dataset.kw === currentKeyword);
        btn.classList.toggle("kw-active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
      updateActiveFilterBar();
      renderCards();
    }

    function resetAllFilters() {
      currentCategory = "전체";
      currentKeyword = "";
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      document.querySelectorAll(".cat-btn").forEach((btn, idx) => {
        btn.classList.toggle("tag-active", idx === 0);
        btn.setAttribute("aria-pressed", String(idx === 0));
      });
      document.querySelectorAll(".kw-btn").forEach(btn => {
        btn.classList.remove("kw-active");
        btn.setAttribute("aria-pressed", "false");
      });

      updateActiveFilterBar();
      renderCards();
    }

    function updateActiveFilterBar() {
      const bar = document.getElementById("activeFilterBar");
      const chips = document.getElementById("activeFilterChips");
      const activeItems = [];

      if (currentCategory !== "전체") {
        activeItems.push(`<button onclick="setCategory('전체')" class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 font-semibold flex items-center gap-1 hover:bg-emerald-100">${currentCategory} <span>✕</span></button>`);
      }
      if (currentKeyword) {
        activeItems.push(`<button onclick="toggleKeyword('${currentKeyword}')" class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 font-semibold flex items-center gap-1 hover:bg-emerald-100">${currentKeyword} <span>✕</span></button>`);
      }
      if (searchQuery) {
        activeItems.push(`<button onclick="clearSearch()" class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 border border-slate-300 font-semibold flex items-center gap-1 hover:bg-slate-200">검색: "${searchQuery}" <span>✕</span></button>`);
      }

      if (activeItems.length > 0) {
        chips.innerHTML = activeItems.join("");
        bar.classList.remove("hidden");
      } else {
        bar.classList.add("hidden");
      }
    }

    let descriptionFrame = null;

    function scheduleDescriptionCheck() {
      if (descriptionFrame !== null) cancelAnimationFrame(descriptionFrame);
      descriptionFrame = requestAnimationFrame(() => {
        descriptionFrame = null;
        updateDescriptionButtons();
      });
    }

    function updateDescriptionButtons() {
      document.querySelectorAll("[data-description]").forEach(desc => {
        const btn = document.getElementById(desc.dataset.buttonId);
        const expanded = btn.getAttribute("aria-expanded") === "true";
        // 펼쳐진 설명도 잠시 두 줄로 제한해 실제 잘림 여부 확인
        desc.classList.add("line-clamp-2");
        const truncated = desc.scrollHeight > desc.clientHeight + 1;
        btn.classList.toggle("hidden", !truncated);
        if (truncated && expanded) desc.classList.remove("line-clamp-2");
        const isExpanded = truncated && expanded;
        btn.setAttribute("aria-expanded", String(isExpanded));
        btn.innerText = isExpanded ? "설명 접기 ▴" : "설명 더보기 ▾";
      });
    }

    function toggleDesc(id) {
      const desc = document.getElementById(`desc_${id}`);
      const btn = document.getElementById(`descBtn_${id}`);
      const expanded = btn.getAttribute("aria-expanded") !== "true";
      desc.classList.toggle("line-clamp-2", !expanded);
      btn.setAttribute("aria-expanded", String(expanded));
      btn.innerText = expanded ? "설명 접기 ▴" : "설명 더보기 ▾";
    }

    function toggleCounselBox(id) {
      const box = document.getElementById(`counselBox_${id}`);
      const btn = document.getElementById(`counselToggleBtn_${id}`);
      const isHidden = box.classList.contains("hidden");
      box.classList.toggle("hidden", !isHidden);
      btn.setAttribute("aria-expanded", String(isHidden));
      btn.innerHTML = isHidden ? "📝 상담 문구 닫기 ▴" : "📝 상담 문구 보기·수정 ▾";
    }

    function renderCards() {
      const listContainer = document.getElementById("cardList");
      const filtered = videoData.filter(item => {
        const matchCat = (currentCategory === "전체") || (item.category === currentCategory);
        const matchKw = (!currentKeyword) || item.tags.includes(currentKeyword);
        const matchSearch = (!searchQuery) || 
          item.title.toLowerCase().includes(searchQuery) ||
          item.description.toLowerCase().includes(searchQuery) ||
          item.keyPoint.toLowerCase().includes(searchQuery) ||
          item.counselText.toLowerCase().includes(searchQuery) ||
          item.tags.some(t => t.toLowerCase().includes(searchQuery));
        return matchCat && matchKw && matchSearch;
      });

      document.getElementById("videoCount").innerText = filtered.length;
      document.getElementById("resultContext").textContent = searchQuery
        ? `‘${document.getElementById("searchInput").value.trim()}’ 검색 결과`
        : [currentCategory !== "전체" ? currentCategory : "", currentKeyword].filter(Boolean).join(" · ") || "전체 영상";

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-600 text-sm space-y-4">
            <p class="font-semibold text-base text-slate-800">조건에 맞는 영상을 찾지 못했습니다.</p>
            <p class="text-xs text-slate-500">다른 검색어를 입력하거나 조건을 줄여 다시 찾아보세요.</p>
            <button onclick="resetAllFilters()" class="px-4 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-xs rounded-xl transition">
              ↻ 필터 전체 초기화
            </button>
          </div>`;
        return;
      }

      currentFiltered = interleaveMembers(sortVideos(filtered));
      renderedCount = 0;
      listContainer.innerHTML = "";
      renderNextBatch();
    }

    // ★ 속도 개선: 카드를 20개씩 나눠 그리고, 스크롤이 끝에 닿으면 다음 20개를 그림
    const BATCH_SIZE = 20;
    let currentFiltered = [];
    let renderedCount = 0;
    let loadObserver = null;

    function renderNextBatch() {
      const listContainer = document.getElementById("cardList");
      const oldSentinel = document.getElementById("loadSentinel");
      if (oldSentinel) oldSentinel.remove();
      const batch = currentFiltered.slice(renderedCount, renderedCount + BATCH_SIZE);
      renderedCount += batch.length;
      listContainer.insertAdjacentHTML("beforeend", batch.map(item => {
        const isShorts = item.title.includes("[Shorts]");
        const cleanTitle = item.title.replace("[Shorts]", "").trim();
        const escapedTitle = esc(cleanTitle.replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
        const T = esc(cleanTitle);
        const isMember = item.access === "회원전용";
        const playCall = isMember ? `openMemberSheet('${item.id}', this)` : `openModal('${item.youtubeId}', '${escapedTitle}', this)`;
        const accessBadge = isMember
          ? `<span class="absolute px-2 py-0.5 rounded text-[11px] font-bold" style="left:8px;bottom:8px;background:rgba(15,23,42,.85);color:#fff;">🔒 회원 전용</span>`
          : item.access === "미리보기"
            ? `<span class="absolute px-2 py-0.5 rounded text-[11px] font-bold" style="left:8px;bottom:8px;background:#047857;color:#fff;">🎓 강의 미리보기</span>`
            : "";

        return `
        <article class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row gap-5 items-start">
          
          <!-- 좌측 16:9 썸네일 버튼 (키보드 접근성 및 이미지 lazy 로딩 적용) -->
          <button type="button" onclick="${playCall}" 
               aria-label="${T} 영상 재생"
               class="relative w-full sm:w-56 aspect-video rounded-xl overflow-hidden bg-slate-900 flex-shrink-0 cursor-pointer group focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <img src="https://img.youtube.com/vi/${item.youtubeId}/mqdefault.jpg" alt="" loading="lazy"
                 onerror="this.style.display='none'"
                 class="w-full h-full object-cover opacity-95 group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition">
              <div class="w-11 h-11 rounded-full bg-black/75 text-white flex items-center justify-center pl-0.5 shadow-lg group-hover:bg-emerald-700 transition">▶</div>
            </div>
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[11px] font-bold ${isShorts ? 'bg-amber-500 text-slate-950' : 'bg-black/70 text-white'}">
              ${isShorts ? '⚡ Shorts' : '📺 일반영상'}
            </span>
            ${accessBadge}
            ${isNew(item) ? `<span class="absolute px-2 py-0.5 rounded text-[11px] font-bold" style="top:8px;right:8px;background:#047857;color:#fff;">NEW</span>` : ""}
          </button>

          <!-- 우측 상세 정보 (제목 최우선 배치) -->
          <div class="flex-1 w-full flex flex-col justify-between min-w-0">
            <div>
              <!-- 1순위: 제목 가장 먼저, 가장 크게 -->
              <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-1 leading-snug break-keep">${T}</h2>
              ${(formatDate(item.date) || item.views) ? `<p class="text-xs mb-1.5" style="color:#64748b;">${[formatDate(item.date), formatViews(item.views)].filter(Boolean).join(" · ")}</p>` : ""}

              <!-- 2순위: 분류 배지 + 핵심 내용 한 줄 문장 -->
              <p class="text-xs sm:text-sm font-semibold text-emerald-800 mb-2 flex items-center gap-1.5 flex-wrap">
                ${item.subBadge ? `<span class="px-2 py-0.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded text-xs font-bold">${esc(item.subBadge)}</span>` : ""}
                ${item.keyPoint ? `<span>🔑 ${esc(item.keyPoint)}</span>` : ""}
              </p>

              <!-- 3순위: 설명 기본 2줄 + 펼치기 -->
              <div class="mb-3">
                <p id="desc_${item.id}" data-description data-button-id="descBtn_${item.id}" class="text-xs sm:text-sm text-slate-600 leading-relaxed line-clamp-2">${esc(item.description)}</p>
                <button id="descBtn_${item.id}" type="button" aria-expanded="false" aria-controls="desc_${item.id}" onclick="toggleDesc('${item.id}')" class="hidden text-[11px] text-slate-400 hover:text-slate-600 font-medium mt-0.5">
                  설명 더보기 ▾
                </button>
              </div>

              <!-- 해시태그 -->
              <div class="flex items-center gap-1.5 flex-wrap mb-3">
                ${item.tags.map(t => `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-medium">${esc(t)}</span>`).join("")}
              </div>

              <!-- 4순위: 상담 문구 미리보기 및 직접 수정 영역 -->
              <div class="mb-3">
                <button id="counselToggleBtn_${item.id}" onclick="toggleCounselBox('${item.id}')" aria-expanded="false"
                  class="text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                  📝 상담 문구 보기·수정 ▾
                </button>
                <div id="counselBox_${item.id}" class="hidden mt-2 p-3 bg-emerald-50/60 border border-emerald-200 rounded-xl">
                  <label for="counselInput_${item.id}" class="block text-[11px] font-bold text-emerald-900 mb-1">
                    💬 전달할 카톡 상담 문구 (필요시 내용을 수정한 뒤 아래 복사 버튼을 누르세요)
                  </label>
                  <textarea id="counselInput_${item.id}" rows="3" 
                    class="w-full p-2.5 text-[16px] sm:text-sm text-slate-800 bg-white border border-emerald-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 leading-relaxed">${esc(item.counselText)}</textarea>
                </div>
              </div>
            </div>

            <!-- 5순위: 하단 액션 버튼 (모바일 2줄 / 데스크톱 1줄 배치) -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full pt-1">
              <!-- 메인 강조 버튼: 문구+링크 복사 -->
              <button onclick="copyCounsel('${item.id}')" 
                class="w-full sm:flex-1 min-h-[44px] py-2.5 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1.5 transition shadow-sm">
                💬 문구+링크 복사
              </button>
              <!-- 보조 버튼 2개: 모바일에서는 나란히 반반 배치 -->
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="${playCall}" 
                  class="flex-1 sm:flex-initial min-h-[44px] px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1.5 transition">
                  ${isMember ? "🔒 강의 안내" : "▶ 영상 보기"}
                </button>
                <button onclick="copyLinkOnly('${item.youtubeId}')" 
                  class="flex-1 sm:flex-initial min-h-[44px] px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1 transition">
                  🔗 링크만 복사
                </button>
              </div>
            </div>

          </div>
        </article>
      `}).join(""));
      if (renderedCount < currentFiltered.length) {
        listContainer.insertAdjacentHTML("beforeend", `<div id="loadSentinel" class="py-6 text-center text-xs text-slate-400">영상 더 불러오는 중… (${renderedCount} / ${currentFiltered.length})</div>`);
        if (!loadObserver) {
          loadObserver = new IntersectionObserver(entries => {
            if (entries.some(e => e.isIntersecting)) renderNextBatch();
          }, { rootMargin: "800px 0px" });
        }
        loadObserver.observe(document.getElementById("loadSentinel"));
      }
      scheduleDescriptionCheck();
    }

    // 회원 전용 영상: 앱 안에서는 재생이 안 되므로 가입 안내 창을 띄움
    function openMemberSheet(id, triggerEl) {
      const item = videoData.find(v => v.id === id);
      if (!item) return;
      lastFocusedElement = triggerEl || document.activeElement;
      closeMemberSheet();
      const title = esc(item.title.replace("[Shorts]", "").trim());
      const wrap = document.createElement("div");
      wrap.id = "memberSheet";
      wrap.setAttribute("role", "dialog");
      wrap.setAttribute("aria-modal", "true");
      wrap.setAttribute("aria-labelledby", "memberSheetTitle");
      wrap.style.cssText = "position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;";
      wrap.innerHTML = `
        <div style="width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom));">
          <div style="width:40px;height:4px;border-radius:2px;background:#cbd5e1;margin:0 auto 16px;"></div>
          <div style="position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#0f172a;">
            <img src="https://img.youtube.com/vi/${item.youtubeId}/mqdefault.jpg" alt="" style="width:100%;height:100%;object-fit:cover;opacity:.55;" onerror="this.remove()">
            <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;">🔒</span>
          </div>
          <p style="margin:16px 0 4px;font-size:13px;font-weight:700;color:#047857;">멤버십 회원 전용</p>
          <h3 id="memberSheetTitle" style="font-size:18px;font-weight:700;color:#0f172a;line-height:1.4;">${title}</h3>
          <p style="margin-top:8px;font-size:14px;color:#475569;line-height:1.6;">${esc(item.description || "마음숲 멤버십 회원만 볼 수 있는 강의예요.")}</p>
          <p style="margin-top:10px;font-size:13px;color:#64748b;">멤버십에 가입하시면 이 강의를 포함한 회원 전용 영상과 라이브를 모두 보실 수 있어요.</p>
          <a href="${JOIN_URL}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;height:50px;margin-top:16px;border-radius:12px;background:#047857;color:#fff;font-weight:700;font-size:15px;">멤버십 가입하기</a>
          <a href="https://youtu.be/${item.youtubeId}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;height:46px;margin-top:8px;border-radius:12px;background:#f1f5f9;color:#1e293b;font-weight:600;font-size:14px;">이미 회원이에요 · 유튜브에서 보기</a>
          <button type="button" id="memberSheetClose" style="width:100%;height:44px;margin-top:8px;border-radius:12px;font-size:14px;color:#64748b;">닫기</button>
        </div>`;
      wrap.addEventListener("click", e => { if (e.target === wrap) closeMemberSheet(); });
      document.body.appendChild(wrap);
      document.getElementById("memberSheetClose").addEventListener("click", closeMemberSheet);
      document.getElementById("memberSheetClose").focus();
    }
    function closeMemberSheet() {
      const el = document.getElementById("memberSheet");
      if (!el) return;
      el.remove();
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    // 수정된 상담문구 + 링크 복사 (복사 실패 시 대체 프롬프트 제공)
    function copyCounsel(id) {
      const item = videoData.find(v => v.id === id);
      if (!item) return;
      const textarea = document.getElementById(`counselInput_${id}`);
      const customText = textarea ? textarea.value.trim() : item.counselText;
      const url = `https://youtu.be/${item.youtubeId}`;
      const fullText = `${customText}\n\n📺 맞춤 영상 바로보기: ${url}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText)
          .then(() => showToast("✅ 상담 문구와 영상 링크가 복사되었습니다!"))
          .catch(() => fallbackCopy(fullText));
      } else {
        fallbackCopy(fullText);
      }
    }

    function copyLinkOnly(ytId) {
      const url = `https://youtu.be/${ytId}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => showToast("🔗 영상 링크만 복사되었습니다!"))
          .catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    }

    // 클립보드 권한 실패 시 대체 수동 복사 처리
    function fallbackCopy(text) {
      window.prompt("클립보드 자동 복사가 제한되었습니다. 아래 내용을 직접 복사(Ctrl+C 또는 길게 누르기)해 주세요:", text);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 2500);
    }

    function openModal(ytId, title, triggerEl) {
      lastFocusedElement = triggerEl || document.activeElement;
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("youtubeFrame").src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
      const modal = document.getElementById("videoModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.getElementById("modalCloseBtn").focus();
    }

    function closeModal() {
      document.getElementById("youtubeFrame").src = "";
      const modal = document.getElementById("videoModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    window.addEventListener("resize", scheduleDescriptionCheck);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(scheduleDescriptionCheck);
    }
    init();
  </script>
</body>
</html>

    let currentCategory = "전체";
    let currentKeyword = "";
    let searchQuery = "";

    function init() {
      renderKeywords();
      renderCards();
      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderCards();
      });
    }

    function renderKeywords() {
      const container = document.getElementById("keywordContainer");
      container.innerHTML = coreKeywords.map(kw => `
        <button onclick="toggleKeyword('${kw}')" data-kw="${kw}"
          class="kw-btn px-2.5 py-1 rounded-md border border-slate-200 bg-white text-xs text-slate-600 hover:bg-slate-100 transition">
          ${kw}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.toggle("tag-active", btn.innerText.includes(cat) || (cat === '전체' && btn.innerText === '전체보기'));
      });
      renderCards();
    }

    function toggleKeyword(kw) {
      currentKeyword = (currentKeyword === kw) ? "" : kw;
      document.querySelectorAll(".kw-btn").forEach(btn => {
        btn.classList.toggle("kw-active", btn.dataset.kw === currentKeyword);
      });
      renderCards();
    }

    function renderCards() {
      const listContainer = document.getElementById("cardList");
      const filtered = videoData.filter(item => {
        const matchCat = (currentCategory === "전체") || (item.category === currentCategory);
        const matchKw = (!currentKeyword) || item.tags.includes(currentKeyword);
        const matchSearch = (!searchQuery) || 
          item.title.toLowerCase().includes(searchQuery) ||
          item.description.toLowerCase().includes(searchQuery) ||
          item.keyPoint.toLowerCase().includes(searchQuery) ||
          item.counselText.toLowerCase().includes(searchQuery) ||
          item.tags.some(t => t.toLowerCase().includes(searchQuery));
        return matchCat && matchKw && matchSearch;
      });

      document.getElementById("videoCount").innerText = filtered.length;

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-slate-200 text-slate-500 text-sm">
            해당 조건에 맞는 영상이 없습니다. 다른 키워드나 검색어를 입력해 보세요.
          </div>`;
        return;
      }

      listContainer.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row gap-5 items-start">
          
          <!-- 좌측 썸네일 -->
          <div onclick="openModal('${item.youtubeId}', '${item.title.replace(/'/g, "\\'")}')" 
               class="relative w-full sm:w-44 h-48 sm:h-44 rounded-xl overflow-hidden bg-slate-900 flex-shrink-0 cursor-pointer group">
            <img src="https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg" alt="thumbnail" 
                 class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition">
              <div class="w-11 h-11 rounded-full bg-red-600 text-white flex items-center justify-center pl-0.5 shadow-lg">▶</div>
            </div>
          </div>

          <!-- 우측 상세 정보 -->
          <div class="flex-1 w-full flex flex-col justify-between">
            <div>
              <div class="flex items-center gap-2 flex-wrap mb-2">
                <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded-md">
                  ${item.subBadge}
                </span>
                <span class="px-2.5 py-0.5 bg-amber-50 text-amber-800 font-semibold text-xs rounded-md flex items-center gap-1">
                  🔑 ${item.keyPoint}
                </span>
              </div>

              <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-1.5 leading-snug">${item.title}</h2>
              <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-3">${item.description}</p>

              <div class="flex items-center gap-1.5 flex-wrap mb-4">
                ${item.tags.map(t => `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-medium">${t}</span>`).join("")}
              </div>
            </div>

            <!-- 하단 액션 버튼 -->
            <div class="flex items-center gap-2 w-full pt-1">
              <button onclick="openModal('${item.youtubeId}', '${item.title.replace(/'/g, "\\'")}')" 
                class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs sm:text-sm rounded-xl flex items-center gap-1.5 flex-shrink-0 transition">
                ▶ 바로 재생
              </button>
              <button onclick="copyCounsel('${item.id}')" 
                class="flex-1 py-2.5 px-3 bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1.5 transition shadow-sm">
                💬 상담멘트+링크 복사
              </button>
              <button onclick="copyLinkOnly('${item.youtubeId}')" 
                class="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs sm:text-sm rounded-xl flex items-center gap-1 flex-shrink-0 transition">
                🔗 링크
              </button>
            </div>
          </div>

        </div>
      `).join("");
    }

    function copyCounsel(id) {
      const item = videoData.find(v => v.id === id);
      if (!item) return;
      const url = `https://youtu.be/${item.youtubeId}`;
      const fullText = `${item.counselText}\n\n📺 맞춤 영상 바로보기: ${url}`;
      navigator.clipboard.writeText(fullText).then(() => showToast("✅ 카톡 상담멘트와 영상 링크가 복사되었습니다!"));
    }

    function copyLinkOnly(ytId) {
      const url = `https://youtu.be/${ytId}`;
      navigator.clipboard.writeText(url).then(() => showToast("🔗 영상 링크가 복사되었습니다!"));
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 2500);
    }

    function openModal(ytId, title) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("youtubeFrame").src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
      const modal = document.getElementById("videoModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      document.getElementById("youtubeFrame").src = "";
      const modal = document.getElementById("videoModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    init();
  </script>

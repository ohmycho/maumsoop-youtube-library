<!DOCTYPE html>
<html lang="ko">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f3f6f4; }
    /* 마음숲 시그니처 그린 테마 */
    .tag-active { background-color: #065f46 !important; color: white !important; border-color: #065f46 !important; font-weight: 600; }
    .kw-active { background-color: #047857 !important; color: white !important; border-color: #047857 !important; font-weight: 600; }

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>

<body class="text-slate-800 pb-24 overflow-x-hidden">

          마음숲 영상 라이브러리
        </h1>

          <button id="clearSearchBtn" onclick="clearSearch()" aria-label="검색어 지우기"

        </div>

      </div>

      <div class="flex justify-between items-center mb-2">
        <button id="mobileFilterBtn" onclick="toggleMobileFilter()" aria-expanded="false" aria-controls="filterPanel"

          <span>🗂️ 주제로 찾아보기</span>
          <span id="mobileFilterIcon">펼치기 ▾</span>
        </button>
      </div>

      <!-- 3. 주제별 분류 & 상담 핵심키워드 패널 (모바일 기본 접힘, PC 기본 펼침) -->
      <div id="filterPanel" class="hidden bg-slate-50/90 p-4 rounded-2xl border border-slate-200/80 space-y-3">

        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="px-2.5 py-1 bg-emerald-100 text-emerald-900 font-bold text-xs rounded-md mr-1">주제 선택</span>

          <button onclick="setCategory('등교거부·자퇴·은둔')" aria-pressed="false" class="cat-btn min-h-[38px] px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">🚪 등교거부·자퇴·은둔</button>
          <button onclick="setCategory('일탈·중독·위기행동')" aria-pressed="false" class="cat-btn min-h-[38px] px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">⚡ 일탈·중독·위기행동</button>
          <button onclick="setCategory('학습부진·무기력·꼼즈')" aria-pressed="false" class="cat-btn min-h-[38px] px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">📚 학습부진·무기력·꼼즈</button>
          <button onclick="setCategory('부모 내면치유·트라우마')" aria-pressed="false" class="cat-btn min-h-[38px] px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">🧘‍♀️ 부모 내면치유·트라우마</button>
          <button onclick="setCategory('엄마의 말공부·가족관계')" aria-pressed="false" class="cat-btn min-h-[38px] px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">🗣️ 엄마의 말공부·가족관계</button>

        <div class="pt-3 border-t border-slate-200/70">

  </header>

  <!-- 메인 콘텐츠 영역 -->

      <div>💡 <strong>'상담 문구 보기·수정'</strong>에서 멘트를 다듬은 뒤 복사할 수 있습니다.</div>
    </div>
    <div id="cardList" class="space-y-4"></div>
  </main>

    ↑
  </button>

    <div class="bg-black rounded-2xl overflow-hidden w-full max-w-3xl relative shadow-2xl">
      <div class="flex justify-between items-center px-4 py-3 bg-slate-900 text-white">
        <span id="modalTitle" class="text-sm font-semibold truncate pr-4">영상 재생</span>
        <button id="modalCloseBtn" onclick="closeModal()" aria-label="영상 창 닫기" class="text-slate-300 hover:text-white px-2 py-1 text-lg font-bold rounded focus:outline-none focus:ring-2 focus:ring-white">✕</button>
      </div>
      <div class="aspect-video w-full bg-black">
        <iframe id="youtubeFrame" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

    let currentCategory = "전체";
    let currentKeyword = "";
    let searchQuery = "";
    let lastFocusedElement = null;

    function init() {
      renderKeywords();
      renderCards();

      const searchInput = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.trim().toLowerCase();

        // 검색어 입력 시 주제와 키워드 필터 초기화
        if (searchQuery.length > 0) {
          currentCategory = "전체";
          currentKeyword = "";
          document.querySelectorAll(".cat-btn").forEach((btn, idx) => {
            btn.classList.toggle("tag-active", idx === 0);
            btn.setAttribute("aria-pressed", String(idx === 0));
          });
          document.querySelectorAll(".kw-btn").forEach(btn => {
            btn.classList.remove("kw-active");
            btn.setAttribute("aria-pressed", "false");
          });
        }

        clearBtn.classList.toggle("hidden", !searchQuery);
        updateActiveFilterBar();
        renderCards();
      });

      // Esc 키로 모달 닫기
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const modal = document.getElementById("videoModal");
          if (!modal.classList.contains("hidden")) closeModal();
        }
      });
    }

    function clearSearch() {
      const searchInput = document.getElementById("searchInput");
      searchInput.value = "";
      searchQuery = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      updateActiveFilterBar();
      renderCards();
      searchInput.focus();
    }

    function toggleMobileFilter() {
      const panel = document.getElementById("filterPanel");
      const btn = document.getElementById("mobileFilterBtn");
      const icon = document.getElementById("mobileFilterIcon");
      const isHidden = panel.classList.contains("hidden");

      panel.classList.toggle("hidden", !isHidden);
      btn.setAttribute("aria-expanded", String(isHidden));
      icon.innerText = isHidden ? "접기 ▴" : "펼치기 ▾";
    }

    function toggleKeywordPanel() {
      const panel = document.getElementById("keywordPanel");
      const open = panel.classList.contains("hidden");
      panel.classList.toggle("hidden", !open);
      document.getElementById("keywordToggleBtn").setAttribute("aria-expanded", String(open));
      document.getElementById("keywordToggleIcon").innerText = open ? "▴" : "▾";
    }

    function renderKeywords() {
      const container = document.getElementById("keywordContainer");
      container.innerHTML = coreKeywords.map(kw => `
        <button onclick="toggleKeyword('${kw}')" data-kw="${kw}" aria-pressed="false"
          class="kw-btn min-h-[36px] px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-100 transition">
          ${kw}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      currentCategory = cat;
      currentKeyword = "";
      document.querySelectorAll(".kw-btn").forEach(btn => {
        btn.classList.remove("kw-active");
        btn.setAttribute("aria-pressed", "false");
      });

      // 버튼 클릭 시 텍스트 검색 초기화
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      document.querySelectorAll(".cat-btn").forEach(btn => {
        const isActive = btn.innerText.includes(cat) || (cat === '전체' && btn.innerText === '전체보기');
        btn.classList.toggle("tag-active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
      updateActiveFilterBar();
      renderCards();
    }

    function toggleKeyword(kw) {
      currentKeyword = (currentKeyword === kw) ? "" : kw;

      // 버튼 클릭 시 텍스트 검색 초기화
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      document.querySelectorAll(".kw-btn").forEach(btn => {
        const isActive = (btn.dataset.kw === currentKeyword);
        btn.classList.toggle("kw-active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
      updateActiveFilterBar();
      renderCards();
    }

    function resetAllFilters() {
      currentCategory = "전체";
      currentKeyword = "";
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");

      document.querySelectorAll(".cat-btn").forEach((btn, idx) => {
        btn.classList.toggle("tag-active", idx === 0);
        btn.setAttribute("aria-pressed", String(idx === 0));
      });
      document.querySelectorAll(".kw-btn").forEach(btn => {
        btn.classList.remove("kw-active");
        btn.setAttribute("aria-pressed", "false");
      });

      updateActiveFilterBar();
      renderCards();
    }

    function updateActiveFilterBar() {
      const bar = document.getElementById("activeFilterBar");
      const chips = document.getElementById("activeFilterChips");
      const activeItems = [];

      if (currentCategory !== "전체") {
        activeItems.push(`<button onclick="setCategory('전체')" class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 font-semibold flex items-center gap-1 hover:bg-emerald-100">${currentCategory} <span>✕</span></button>`);
      }
      if (currentKeyword) {
        activeItems.push(`<button onclick="toggleKeyword('${currentKeyword}')" class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 font-semibold flex items-center gap-1 hover:bg-emerald-100">${currentKeyword} <span>✕</span></button>`);
      }
      if (searchQuery) {
        activeItems.push(`<button onclick="clearSearch()" class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 border border-slate-300 font-semibold flex items-center gap-1 hover:bg-slate-200">검색: "${searchQuery}" <span>✕</span></button>`);
      }

      if (activeItems.length > 0) {
        chips.innerHTML = activeItems.join("");
        bar.classList.remove("hidden");
      } else {
        bar.classList.add("hidden");
      }
    }

    function toggleDesc(id) {
      const desc = document.getElementById(`desc_${id}`);
      const btn = document.getElementById(`descBtn_${id}`);
      const isClamped = desc.classList.contains("line-clamp-2");
      desc.classList.toggle("line-clamp-2", !isClamped);
      btn.innerText = isClamped ? "설명 접기 ▴" : "설명 더보기 ▾";
    }

    function toggleCounselBox(id) {
      const box = document.getElementById(`counselBox_${id}`);
      const btn = document.getElementById(`counselToggleBtn_${id}`);
      const isHidden = box.classList.contains("hidden");
      box.classList.toggle("hidden", !isHidden);
      btn.setAttribute("aria-expanded", String(isHidden));
      btn.innerHTML = isHidden ? "📝 상담 문구 닫기 ▴" : "📝 상담 문구 보기·수정 ▾";
    }

    function renderCards() {
      const listContainer = document.getElementById("cardList");
      const filtered = videoData.filter(item => {
        const matchCat = (currentCategory === "전체") || (item.category === currentCategory);
        const matchKw = (!currentKeyword) || item.tags.includes(currentKeyword);
        const matchSearch = (!searchQuery) || 
          item.title.toLowerCase().includes(searchQuery) ||
          item.description.toLowerCase().includes(searchQuery) ||
          item.keyPoint.toLowerCase().includes(searchQuery) ||
          item.counselText.toLowerCase().includes(searchQuery) ||
          item.tags.some(t => t.toLowerCase().includes(searchQuery));
        return matchCat && matchKw && matchSearch;
      });

      document.getElementById("videoCount").innerText = filtered.length;
      document.getElementById("resultContext").textContent = searchQuery
        ? `‘${document.getElementById("searchInput").value.trim()}’ 검색 결과`
        : [currentCategory !== "전체" ? currentCategory : "", currentKeyword].filter(Boolean).join(" · ") || "전체 영상";

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-600 text-sm space-y-4">
            <p class="font-semibold text-base text-slate-800">조건에 맞는 영상을 찾지 못했습니다.</p>
            <p class="text-xs text-slate-500">다른 검색어를 입력하거나 조건을 줄여 다시 찾아보세요.</p>
            <button onclick="resetAllFilters()" class="px-4 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-xs rounded-xl transition">
              ↻ 필터 전체 초기화
            </button>
          </div>`;
        return;
      }

      listContainer.innerHTML = filtered.map(item => {
        const isShorts = item.title.includes("[Shorts]");
        const cleanTitle = item.title.replace("[Shorts]", "").trim();
        const escapedTitle = cleanTitle.replace(/'/g, "\\'");

        return `
        <article class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row gap-5 items-start">
          
          <!-- 좌측 16:9 썸네일 버튼 (키보드 접근성 및 이미지 lazy 로딩 적용) -->
          <button type="button" onclick="openModal('${item.youtubeId}', '${escapedTitle}', this)" 
               aria-label="${cleanTitle} 영상 재생"
               class="relative w-full sm:w-56 aspect-video rounded-xl overflow-hidden bg-slate-900 flex-shrink-0 cursor-pointer group focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <img src="https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg" alt="" loading="lazy"
                 onerror="this.style.display='none'"
                 class="w-full h-full object-cover opacity-95 group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition">
              <div class="w-11 h-11 rounded-full bg-black/75 text-white flex items-center justify-center pl-0.5 shadow-lg group-hover:bg-emerald-700 transition">▶</div>
            </div>
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[11px] font-bold ${isShorts ? 'bg-amber-500 text-slate-950' : 'bg-black/70 text-white'}">
              ${isShorts ? '⚡ Shorts' : '📺 일반영상'}
            </span>
          </button>

          <!-- 우측 상세 정보 (제목 최우선 배치) -->
          <div class="flex-1 w-full flex flex-col justify-between min-w-0">
            <div>
              <!-- 1순위: 제목 가장 먼저, 가장 크게 -->
              <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-1 leading-snug break-keep">${cleanTitle}</h2>

              <!-- 2순위: 분류 배지 + 핵심 내용 한 줄 문장 -->
              <p class="text-xs sm:text-sm font-semibold text-emerald-800 mb-2 flex items-center gap-1.5 flex-wrap">
                <span class="px-2 py-0.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded text-xs font-bold">${item.subBadge}</span>
                <span>🔑 ${item.keyPoint}</span>

                <button id="descBtn_${item.id}" onclick="toggleDesc('${item.id}')" class="text-[11px] text-slate-400 hover:text-slate-600 font-medium mt-0.5">
                  설명 더보기 ▾
                </button>
              </div>

              <!-- 해시태그 -->
              <div class="flex items-center gap-1.5 flex-wrap mb-3">
                ${item.tags.map(t => `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-medium">${t}</span>`).join("")}
              </div>

              <!-- 4순위: 상담 문구 미리보기 및 직접 수정 영역 -->
              <div class="mb-3">
                <button id="counselToggleBtn_${item.id}" onclick="toggleCounselBox('${item.id}')" aria-expanded="false"
                  class="text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                  📝 상담 문구 보기·수정 ▾
                </button>
                <div id="counselBox_${item.id}" class="hidden mt-2 p-3 bg-emerald-50/60 border border-emerald-200 rounded-xl">
                  <label for="counselInput_${item.id}" class="block text-[11px] font-bold text-emerald-900 mb-1">
                    💬 전달할 카톡 상담 문구 (필요시 내용을 수정한 뒤 아래 복사 버튼을 누르세요)
                  </label>
                  <textarea id="counselInput_${item.id}" rows="3" 
                    class="w-full p-2.5 text-[16px] sm:text-sm text-slate-800 bg-white border border-emerald-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 leading-relaxed">${item.counselText}</textarea>
                </div>
              </div>
            </div>

            <!-- 5순위: 하단 액션 버튼 (모바일 2줄 / 데스크톱 1줄 배치) -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full pt-1">
              <!-- 메인 강조 버튼: 문구+링크 복사 -->
              <button onclick="copyCounsel('${item.id}')" 
                class="w-full sm:flex-1 min-h-[44px] py-2.5 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1.5 transition shadow-sm">
                💬 문구+링크 복사
              </button>
              <!-- 보조 버튼 2개: 모바일에서는 나란히 반반 배치 -->
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="openModal('${item.youtubeId}', '${escapedTitle}', this)" 
                  class="flex-1 sm:flex-initial min-h-[44px] px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1.5 transition">
                  ▶ 영상 보기
                </button>
                <button onclick="copyLinkOnly('${item.youtubeId}')" 
                  class="flex-1 sm:flex-initial min-h-[44px] px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-1 transition">
                  🔗 링크만 복사
                </button>
              </div>
            </div>

          </div>
        </article>
      `}).join("");
    }

    // 수정된 상담문구 + 링크 복사 (복사 실패 시 대체 프롬프트 제공)
    function copyCounsel(id) {
      const item = videoData.find(v => v.id === id);
      if (!item) return;
      const textarea = document.getElementById(`counselInput_${id}`);
      const customText = textarea ? textarea.value.trim() : item.counselText;
      const url = `https://youtu.be/${item.youtubeId}`;
      const fullText = `${customText}\n\n📺 맞춤 영상 바로보기: ${url}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText)
          .then(() => showToast("✅ 상담 문구와 영상 링크가 복사되었습니다!"))
          .catch(() => fallbackCopy(fullText));
      } else {
        fallbackCopy(fullText);
      }
    }

    function copyLinkOnly(ytId) {
      const url = `https://youtu.be/${ytId}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => showToast("🔗 영상 링크만 복사되었습니다!"))
          .catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    }

    // 클립보드 권한 실패 시 대체 수동 복사 처리
    function fallbackCopy(text) {
      window.prompt("클립보드 자동 복사가 제한되었습니다. 아래 내용을 직접 복사(Ctrl+C 또는 길게 누르기)해 주세요:", text);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 2500);
    }

    function openModal(ytId, title, triggerEl) {
      lastFocusedElement = triggerEl || document.activeElement;
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("youtubeFrame").src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
      const modal = document.getElementById("videoModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.getElementById("modalCloseBtn").focus();
    }

    function closeModal() {
      document.getElementById("youtubeFrame").src = "";
      const modal = document.getElementById("videoModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    init();
  </script>
</body>
</html>
